<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Banzai Admin — Conectar</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    :root{--bg:#06080F;--surface:#0C0F1A;--surface2:#111520;--surface3:#161B2E;--border:rgba(255,255,255,.07);--border2:rgba(255,255,255,.12);--text:#F0F2FA;--text2:#9AA3C2;--text3:#4E5B7A;--brand:#6366F1;--brand-dim:rgba(99,102,241,.12);--brand-glow:rgba(99,102,241,.25);--brand-dark:#4F46E5;--green:#10B981;--red:#EF4444;--r:10px;--r-lg:16px;--r-xl:22px;}
    body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 24px;-webkit-font-smoothing:antialiased;}
    body::before{content:'';position:fixed;top:-20%;left:-10%;width:60vw;height:60vw;border-radius:50%;background:radial-gradient(circle,rgba(99,102,241,.07) 0%,transparent 65%);pointer-events:none;}
    .dot-grid{position:fixed;inset:0;background-image:radial-gradient(rgba(255,255,255,.025) 1px,transparent 1px);background-size:28px 28px;pointer-events:none;}
    .shell{max-width:420px;width:100%;position:relative;z-index:1;}
    .wordmark{display:flex;align-items:center;gap:12px;justify-content:center;margin-bottom:36px;}
    .wm-mark{width:44px;height:44px;background:var(--brand);border-radius:13px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:16px;color:#fff;box-shadow:0 0 24px var(--brand-glow);}
    .wm-name{font-size:24px;font-weight:800;letter-spacing:-.03em;}
    .admin-tag{font-size:11px;font-weight:700;background:rgba(99,102,241,.15);color:var(--brand);padding:2px 8px;border-radius:4px;margin-left:8px;letter-spacing:.06em;text-transform:uppercase;}
    .card{background:var(--surface);border:1px solid var(--border2);border-radius:var(--r-xl);padding:36px;box-shadow:0 32px 80px rgba(0,0,0,.5);}
    h2{font-size:20px;font-weight:700;margin-bottom:4px;}
    .sub{font-size:13px;color:var(--text3);margin-bottom:24px;}
    .url-badge{background:var(--surface3);border:1px solid var(--border);border-radius:var(--r);padding:10px 14px;font-size:12px;color:var(--text2);margin-bottom:20px;display:flex;align-items:center;gap:8px;}
    .url-badge .dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green);flex-shrink:0;}
    label{display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--text3);margin-bottom:5px;margin-top:16px;}
    input{width:100%;background:var(--surface3);border:1px solid var(--border2);border-radius:var(--r);color:var(--text);font:inherit;font-size:14px;padding:11px 14px;outline:none;transition:border-color .15s,box-shadow .15s;}
    input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-dim);}
    .btn{width:100%;background:var(--brand);color:#fff;border:none;border-radius:var(--r);padding:13px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;margin-top:20px;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:8px;}
    .btn:hover{background:var(--brand-dark);box-shadow:0 0 20px var(--brand-glow);}
    .err{color:var(--red);font-size:12px;margin-top:10px;min-height:16px;}
    .footer{text-align:center;font-size:11px;color:var(--text3);margin-top:20px;}
  </style>
</head>
<body>
<div class="dot-grid"></div>
<div class="shell">
  <div class="wordmark">
    <div class="wm-mark">BZ</div>
    <div class="wm-name">Banzai<span class="admin-tag">Admin</span></div>
  </div>
  <div class="card">
    <h2>Conectar con Banzai</h2>
    <p class="sub">Ingresá con las mismas credenciales de tu workspace</p>
    <div class="url-badge"><div class="dot"></div><span>{{ banzai_url }}</span></div>
    <label>Email</label>
    <input id="email" type="email" placeholder="tu@email.com" autocomplete="username">
    <label>Contraseña</label>
    <input id="password" type="password" placeholder="••••••••" autocomplete="current-password">
    <button class="btn" id="btn-connect" onclick="connect()">Conectar →</button>
    <div class="err" id="err"></div>
    <div class="footer">Banzai Admin v1.0 · Panel de administración</div>
  </div>
</div>
<script>
document.getElementById('password').addEventListener('keydown', e=>{ if(e.key==='Enter') connect(); });
async function connect() {
  document.getElementById('err').textContent = '';
  document.getElementById('btn-connect').textContent = 'Entrando…';
  document.getElementById('btn-connect').disabled = true;
  const r = await fetch('/api/admin-login', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      email:document.getElementById('email').value,
      password:document.getElementById('password').value,
      banzai_email:document.getElementById('banzai-email')?.value||'',
      banzai_password:document.getElementById('banzai-password')?.value||'',
    })
  });
  const d = await r.json();
  if(d.ok) {
    const status = document.getElementById('banzai-status');
    if(status) status.textContent = d.message || '';
    setTimeout(() => window.location.href='/', 800);
  } else {
    document.getElementById('err').textContent = d.error||'Error';
    document.getElementById('btn-connect').textContent='Entrar al Admin →';
    document.getElementById('btn-connect').disabled = false;
  }
}
</script>
</body>
</html>
