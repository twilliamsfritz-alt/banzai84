<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>¡Gracias! — Banzai</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    :root{--bg:#06080F;--surface:#0C0F1A;--brand:#6366F1;--brand-glow:rgba(99,102,241,.25);--green:#10B981;--green-dim:rgba(16,185,129,.12);--text:#F0F2FA;--text3:#4E5B7A;}
    body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 20px;-webkit-font-smoothing:antialiased;}
    .card{background:var(--surface);border:1px solid rgba(16,185,129,.25);border-radius:22px;padding:48px 40px;text-align:center;max-width:420px;box-shadow:0 32px 80px rgba(0,0,0,.5);}
    .icon{width:64px;height:64px;background:var(--green-dim);border:1.5px solid rgba(16,185,129,.3);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;margin:0 auto 20px;}
    h2{font-size:22px;font-weight:700;margin-bottom:10px;}
    p{font-size:13px;color:var(--text3);line-height:1.7;}
    .footer{margin-top:24px;font-size:11px;color:var(--text3);}
  </style>
</head>
<body>
<div class="card">
  <div class="icon">✓</div>
  <h2>¡Gracias por tu feedback!</h2>
  <p>Tu respuesta fue recibida. Si dejaste una sugerencia de mejora, el equipo de Banzai la va a revisar personalmente antes de aplicar cualquier cambio.</p>
  <div class="footer">Banzai · Gracias por ayudarnos a mejorar</div>
</div>
</body>
</html>
